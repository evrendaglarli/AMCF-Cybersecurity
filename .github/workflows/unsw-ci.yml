name: UNSW-NB15 prototype CI

on:
  push:
    branches: [experiment/unsw-nb15-feasibility-20261019]
  pull_request:
    branches: [main]

permissions:
  contents: read

jobs:
  unsw-pilot:
    name: Prototype static and unit checks
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Install focused dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install "numpy>=1.24,<3" "pandas>=2.0,<3" "scipy>=1.10,<2" "scikit-learn>=1.4,<2"
      - name: Compile pilot scripts
        run: python -m py_compile experiments/unsw_nb15_feasibility.py experiments/unsw_nb15_robustness.py
      - name: Run synthetic fixture tests only
        run: |
          python -m unittest discover -s tests -p 'test_unsw_nb15_feasibility.py' -v
          python -m unittest discover -s tests -p 'test_unsw_nb15_robustness.py' -v
      - name: Check archived result schema
        run: |
          python - <<'PY'
          import csv, json
          from pathlib import Path
          base=Path('reports')
          for name, n in [('unsw_nb15_full_metrics.csv',3),('unsw_nb15_robustness_seed_operating_points.csv',45),('unsw_nb15_robustness_paired_differences.csv',30),('unsw_nb15_robustness_seed_summary.csv',9)]:
              with (base/name).open(newline='',encoding='utf-8') as f: rows=list(csv.DictReader(f))
              assert len(rows)==n,(name,len(rows),n)
          for name in ['unsw_nb15_full_provenance.json','unsw_nb15_robustness_provenance.json']:
              obj=json.loads((base/name).read_text(encoding='utf-8'))
              assert 'sha256_train' in obj or 'train_sha256' in obj
          PY
