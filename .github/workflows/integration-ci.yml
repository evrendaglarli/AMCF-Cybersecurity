name: AMCF integrated reference checks

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

permissions:
  contents: read

jobs:
  reference-checks:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Install focused dependencies for offline checks
        run: |
          python -m pip install --upgrade pip
          python -m pip install "numpy>=1.24,<3" "scipy>=1.10,<2" "pandas>=2,<3" "scikit-learn>=1.4,<2"
      - name: Compile all tracked Python sources
        run: python -m compileall -q amcf experiments tests setup.py
      - name: Rare-event mathematics
        run: python -m unittest discover -s tests -p 'test_rare_event_risk.py' -v
      - name: Safety contract behavior
        run: python -m unittest discover -s tests -p 'test_gate0_safety_contract.py' -v
      - name: UNSW real-data loader and flow-level metrics tests (fixtures only)
        run: python -m unittest discover -s tests -p 'test_unsw_nb15_feasibility.py' -v
      - name: UNSW repeated-seed statistical utilities (fixtures only)
        run: python -m unittest discover -s tests -p 'test_unsw_nb15_robustness.py' -v
